name: 功能建议
description: 提出新能力或交互改动
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么
      description: 先说场景和痛点，再说方案；只写「加个导出 Excel」这种结论会被要求补充
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 涉及的接口、页面、权限（对应 `read` / `manage` / `manage_admins` / `dangerous`）
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 参与者页面（Roll / 排行榜 / 开奖）
        - 管理后台
        - API 与 WebSocket
        - 鉴权与权限
        - 数据库与迁移
        - 部署与镜像
        - 界面样式
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与取舍
      description: 考虑过但没选的做法，以及为什么
