[project]
name = "team-roll"
version = "2.0.0"
description = "团队 Roll 点活动平台"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ARG", "C4", "RET"]
ignore = ["E501", "B008", "RET504", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["ARG001", "E402"]
"tests/*" = ["ARG001"]
# TypeDecorator.process_* must keep the dialect argument SQLAlchemy passes.
"app/core/time.py" = ["ARG002"]
