{% extends "base.html" %}

{% block title %}Team Roll - 管理员登录{% endblock %}

{% block extra_css %}
{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
        <h1 class="text-3xl font-bold text-primary mb-8 text-center">管理员登录</h1>
        
        {% if error %}
            <div class="bg-red-100 dark:bg-red-900/30 text-red-800 dark:text-red-200 p-4 rounded-lg mb-6 text-center font-medium border border-red-200 dark:border-red-800 shadow-sm">
                ⚠️ {{ error }}
            </div>
        {% endif %}
        
        <div class="glass-effect p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-6 text-gray-800 dark:text-gray-200">登录信息</h2>
            <form action="/admin/login" method="post">
                <div class="mb-6">
                    <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">用户名</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        placeholder="请输入用户名" 
                        class="w-full px-4 py-3 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-colors duration-300"
                    >
                </div>
                
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">密码</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="请输入密码" 
                        class="w-full px-4 py-3 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-colors duration-300"
                    >
                </div>
                
                <button 
                    type="submit" 
                    class="w-full py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 transition-colors duration-300 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-dark-bg"
                >
                    登录
                </button>
            </form>
        </div>
        
        <div class="flex justify-center">
            <button 
                onclick="window.location.href='/'" 
                class="px-6 py-3 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white font-medium rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-300 shadow-sm hover:shadow-md focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 dark:focus:ring-offset-dark-bg"
            >
                返回首页
            </button>
        </div>
{% endblock %}
